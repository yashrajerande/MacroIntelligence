name: MacroIntelligence Corp - Daily Run

on:
  schedule:
    - cron: '30 21 * * *'   # 21:30 UTC = 03:00 IST — the edition
    - cron: '30 23 * * *'   # 23:30 UTC = 05:00 IST — retry window: no-op if 03:00 published
  workflow_dispatch:
    inputs:
      run_date_override:
        description: 'Override date (YYYY-MM-DD). Leave blank for today.'
        required: false
        default: ''
      refetch_segments:
        description: 'Force a fresh segmented real-estate fetch (ticket size / city / NRI) instead of the weekly snapshot'
        required: false
        type: boolean
        default: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: macro-intelligence/package-lock.json

      - name: Install dependencies
        working-directory: macro-intelligence
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "MacroIntelligence Corp"
          git config user.email "pipeline@macrointelligence.corp"
          git remote set-url origin \
            https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git

      - name: Pre-flight tests
        working-directory: macro-intelligence
        run: node test.js

      # Free-tier Supabase pauses after a week without traffic. This ping
      # is the keep-alive. It used to query a table that does not exist
      # (run_metadata) so it printed "ping failed" on every run, including
      # successful ones, and never actually touched the database.
      - name: Keep Supabase alive
        run: |
          curl -sf "$SUPABASE_URL/rest/v1/dashboard_runs?select=run_date&order=run_date.desc&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            && echo " ← Supabase reachable" || echo "Supabase ping failed (may be paused) — pipeline will publish from cache"
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Run pipeline
        working-directory: macro-intelligence
        run: node agents/CEO/orchestrate.js
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FRED_API_KEY:         ${{ secrets.FRED_API_KEY }}
          GH_PAT:              ${{ secrets.GH_PAT }}
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          RABBIT_HOLE_URL:     ${{ secrets.RABBIT_HOLE_URL }}
          DATE_OVERRIDE:        ${{ inputs.run_date_override }}
          # A human pressing "Run workflow" always wants a fresh edition;
          # the scheduled 05:00 retry must be a no-op when 03:00 succeeded.
          FORCE_RERUN:          ${{ github.event_name == 'workflow_dispatch' }}
          FORCE_RE_SEGMENTS:    ${{ inputs.refetch_segments == true }}
          GITHUB_REPOSITORY:    ${{ github.repository }}
          NODE_ENV:             production

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs-${{ github.run_id }}
          path: macro-intelligence/logs/
          retention-days: 7

      # The orchestrator alerts on its own failure paths. This catches
      # everything before it gets that far — npm ci, the pre-flight test
      # suite, a runner crash — so a broken run is never silent.
      - name: Alert on failure
        if: failure()
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          TEXT=$'🚨 MacroIntelligence workflow FAILED ('"${{ github.event_name }}"$') before the pipeline could report.\nStep logs: '"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null || true
        env:
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
